  # 2. The shared kernel must not depend on any module (not even a public API).
  - name: shared-imports-catalog
    edge: imports
    from_layer: shared
    to_layer: catalog
    allowed: false
    severity: 3
  - name: shared-imports-ticketing
    edge: imports
    from_layer: shared
    to_layer: ticketing
    allowed: false
    severity: 3
  - name: shared-imports-payments
    edge: imports
    from_layer: shared
    to_layer: payments
    allowed: false
    severity: 3
  - name: shared-imports-notifications
    edge: imports
    from_layer: shared
    to_layer: notifications
    allowed: false
    severity: 3
  - name: shared-imports-module-apis
    edge: imports
    from_layer: shared
    to_layer: module_api
    allowed: false
    severity: 3
  # 3. Platform code is generic infrastructure: it must not know about modules.
  - name: platform-imports-catalog
    edge: imports
    from_layer: platform
    to_layer: catalog
    allowed: false
    severity: 2
  - name: platform-imports-ticketing
    edge: imports
